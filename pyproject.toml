[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OmniRouteConfig"
version = "0.2.0"
description = "Bootstrap + auto-configure OmniRoute for $0-spend AI routing. Curated provider configs, env-var conventions, idempotent setup scripts."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sudhir Singh" }]
requires-python = ">=3.11"
keywords = [
    "omniroute",
    "ai-gateway",
    "llm-router",
    "free-tier",
    "openai-compatible",
    "litellm",
    "config-as-code",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Installation/Setup",
]

dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
client = [
    "openai>=1.50,<3",
]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24",
    "respx>=0.21,<1",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
omniroutectl = "omni_route_config.cli:main"

[project.urls]
Repository = "https://github.com/sudhir13s/OmniRouteConfig"
Issues = "https://github.com/sudhir13s/OmniRouteConfig/issues"
OmniRoute = "https://github.com/sudhir13s/OmniRoute"

[tool.setuptools.packages.find]
include = ["omni_route_config*"]
exclude = ["omni_route_config.tests*", "tests*"]

[tool.setuptools.package-data]
omni_route_config = ["py.typed", "*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["omni_route_config/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
